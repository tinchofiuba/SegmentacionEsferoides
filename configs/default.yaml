# LEGACY: dataset original de la primera ronda de experimentos. El directorio
# de descargas y inputsConvertidas/0_1_2_3 ya no existen en disco (ver
# docs/status.md). Se mantiene el archivo como referencia histórica; el
# dataset vigente es configs/insitu_3t3.yaml.
paths:
  images_dir: "data/legacy/raw"
  masks_dir: "data/legacy/masks"
  output_dir: "outputs"

training:
  epochs: 60
  batch_size: 4
  learning_rate: 0.0001
  crop_size: 512
  num_classes: 4
  patches_per_image: 16
  test_image_basename: "216 - 7d 3T3_4x" # Updated to the existing file
  seed: 42

inference:
  use_tta: true
  morphology_kernel_size: 5
