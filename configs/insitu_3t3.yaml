paths:
  images_dir: "data/insitu_3t3/raw"
  masks_dir: "data/insitu_3t3/masks"
  output_dir: "outputs"
  # Split materializado (mismo reparto que daba seed=42 + train/val/test_split
  # de abajo sobre las 96 imágenes actuales) — ver splits/insitu_3t3/*.txt.
  # Tiene prioridad sobre train_split/val_split/test_split.
  splits_dir: "splits/insitu_3t3"

training:
  epochs: 40
  batch_size: 4
  learning_rate: 0.0001
  crop_size: 512
  num_classes: 4
  patches_per_image: 16
  train_split: 0.60
  val_split: 0.30
  test_split: 0.10
  seed: 42

inference:
  use_tta: true
  morphology_kernel_size: 5
